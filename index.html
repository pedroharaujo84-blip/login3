<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="form">
            <h1>Bem-vindo!</h1>
            <p class="subtitulo">
                Entre na sua conta
            </p>
            <div class="campo">
                <label for="usuario">E-mail</label>
                <input
                    type="email"
                    id="usuario"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>
            <button type="submit" class="btn-principal">
                Entrar
            </button>
            <div class="separador">
                <span>ou</span>
            </div>
            <button
                type="button"
                class="btn-secundario"
                onclick="window.location.href='cadastro.html'"
            >
                Criar uma conta
            </button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="formCadastro">
            <h1>Criar Conta</h1>
            <p class="subtitulo">
                Preencha seus dados
            </p>
            <div class="campo">
                <label for="novoNome">Nome</label>
                <input
                    type="text"
                    id="novoNome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                >
            </div>
            <div class="campo">
                <label for="novoEmail">E-mail</label>
                <input
                    type="email"
                    id="novoEmail"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>
            <div class="campo">
                <label for="novaSenha">Senha</label>
                <input
                    type="password"
                    id="novaSenha"
                    placeholder="Mínimo de 6 caracteres"
                    autocomplete="new-password"
                    required
                >
            </div>
            <div class="campo">
                <label for="confirmaSenha">
                    Confirmar senha
                </label>
                <input
                    type="password"
                    id="confirmaSenha"
                    placeholder="Digite a senha novamente"
                    autocomplete="new-password"
                    required
                >
            </div>
            <button type="submit" class="btn-principal">
                Cadastrar
            </button>
            <button
                type="button"
                class="btn-secundario"
                onclick="window.location.href='index.html'"
            >
                Voltar para o Login
            </button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
