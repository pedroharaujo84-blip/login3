<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="paginaProtegida">
        <header class="topo">
            <div class="logo">
                Minha Área
            </div>
            <button
                type="button"
                id="btnSair"
                class="btn-sair"
            >
                Sair
            </button>
        </header>
        <main class="conteudo-home">
            <div class="card-home">
                <h1>
                    Olá,
                    <span id="nomeUsuario">
                        Usuário
                    </span>!
                </h1>
                <p>
                    Seja bem-vindo à sua área.
                </p>
                <div class="opcoes">
                    <div class="opcao">
                        <h3>Treinos</h3>
                        <p>
                            Acesse seus treinos.
                        </p>
                        <button
                            type="button"
                            id="btnTreinoA"
                            class="btn-principal"
                        >
                            Ver treinos
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
